<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<title>ERD Interactive - Racehorse Training System</title>
<style>
:root{--bg:#fafafa;--ink:#111;--dim:#bbb;--hl:#d62828;--hl2:#1d4ed8;}
*{box-sizing:border-box}
body{margin:0;font-family:Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid #ddd;background:#fff;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:700}
button{font:inherit;padding:4px 10px;border:1px solid #333;background:#fff;cursor:pointer;border-radius:4px}
button:hover{background:#eee}
input[type=search]{font:inherit;padding:4px 10px;border:1px solid #333;border-radius:4px;width:220px}
.wrap{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;overflow:hidden;background:#fff}
#svg{width:100%;height:100%;display:block;cursor:grab}
#svg.dragging{cursor:grabbing}
#side{width:330px;border-left:1px solid #ddd;background:#fff;overflow:auto;padding:12px}
#side h2{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.5px;color:#555}
.node rect{fill:#fff;stroke:#111;stroke-width:1.2}
.node text{font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:#111;pointer-events:none;user-select:none}
.node{cursor:pointer}
.edge polyline{fill:none;stroke:#111;stroke-width:1.3}
.edge .hit{stroke:transparent;stroke-width:12;fill:none;cursor:pointer}
.edge .crow,.edge .one{stroke:#111;stroke-width:1.3;fill:none}
.dim{opacity:.07}
.hl-edge polyline{stroke:var(--hl);stroke-width:2.4}
.hl-edge .crow,.hl-edge .one{stroke:var(--hl)}
.hl-node rect{stroke:var(--hl);stroke-width:2.6;fill:#fff4f4}
.related rect{stroke:var(--hl2);stroke-width:2}
.sel-node rect{fill:#eef4ff;stroke:var(--hl2);stroke-width:3}
.rel-list{list-style:none;margin:0;padding:0;font-size:13px}
.rel-list li{padding:5px 0;border-bottom:1px solid #eee;display:flex;gap:6px;align-items:baseline}
.rel-list .arrow{color:#888;font-weight:700}
.rel-list .name{font-weight:600}
.hint{font-size:12px;color:#666;line-height:1.5}
#legend{font-size:12px;color:#444;margin-top:14px;border-top:1px solid #ddd;padding-top:10px}
#legend .row{display:flex;align-items:center;gap:8px;margin:4px 0}
#legend svg{flex:0 0 auto}
</style>
</head>
<body>
<header>
  <h1>ERD — Racehorse Training System</h1>
  <input id="search" type="search" placeholder="Tìm bảng..." />
  <button id="fit">Fit</button>
  <button id="reset">Reset</button>
  <button id="toggleDim">Dim: on</button>
  <button id="exportPng">PNG</button>
  <span class="hint">Hover bảng/đường để xem liên kết · Click để ghim · Lăn chuột để zoom · Kéo để di chuyển</span>
</header>

  <div id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>

    <div id="detail" class="hint">Chưa chọn bảng. Hover hoặc click vào một bảng để xem các quan hệ.</div>
    <div id="legend">

function crowAt(p, prev, len=13){
  // prongs open along the segment direction (away from line), apex at p
  const dx=p.x-prev.x, dy=p.y-prev.y, L=Math.hypot(dx,dy)||1;
  const ux=dx/L, uy=dy/L; const ang=Math.atan2(uy,ux);
  const spread=Math.PI/6;
  const pts=[0,-spread,spread].map(a=>{
    const x=p.x+Math.cos(ang+a)*len, y=p.y+Math.sin(ang+a)*len;
    return `${p.x},${p.y} ${x.toFixed(1)},${y.toFixed(1)}`;
  });
  return pts;
}
function oneTick(p, prev, len=13){
  const dx=p.x-prev.x, dy=p.y-prev.y, L=Math.hypot(dx,dy)||1;
  const px=-dy/L*len/2, py=dx/L*len/2;
  return {x1:p.x-px,y1:p.y-py,x2:p.x+px,y2:p.y+py};
}

const nodeEls=new Map();
DATA.nodes.forEach(n=>{
  const g=el('g',{class:'node','data-name':n.id});
  g.appendChild(el('rect',{x:n.x,y:n.y,width:DATA.box.w,height:DATA.box.h,rx:3}));
  const t=el('text',{x:n.x+DATA.box.w/2,y:n.y+DATA.box.h/2});
  t.textContent=n.id;
  g.appendChild(t);
  g.addEventListener('mouseenter',()=>onHoverNode(n.id));
  g.addEventListener('mouseleave',()=>onHoverNode(null));
  g.addEventListener('click',(ev)=>{ev.stopPropagation(); selectNode(n.id);});
  gNodes.appendChild(g);
  nodeEls.set(n.id,g);
});

svg.addEventListener('click',()=>selectNode(null));

function clearClasses(){
  nodeEls.forEach(g=>g.classList.remove('dim','hl-node','related','sel-node'));
  edgeEls.forEach(g=>g.classList.remove('dim','hl-edge'));
}
function onHoverNode(name){
  hovered=name;
  if(selected) return;
  renderHighlight(name,null);
}
function onHoverEdge(idx){
  if(selected) return;
  renderHighlight(null,idx);
}
function renderHighlight(nodeName, edgeIdx){
  clearClasses();
  if(!nodeName && edgeIdx==null){
    return;
  }
  const keepNodes=new Set();
  const keepEdges=new Set();
  if(nodeName){
    keepNodes.add(nodeName);
    incident.get(nodeName).forEach(i=>{keepEdges.add(i);keepNodes.add(DATA.edges[i].source);keepNodes.add(DATA.edges[i].target);});
    nodeEls.get(nodeName).classList.add('hl-node');
  }
  if(edgeIdx!=null){
    keepEdges.add(edgeIdx);
    keepNodes.add(DATA.edges[edgeIdx].source);keepNodes.add(DATA.edges[edgeIdx].target);
  }
  if(dim){
    nodeEls.forEach((g,n)=>{if(!keepNodes.has(n))g.classList.add('dim');});
    edgeEls.forEach((g,i)=>{if(!keepEdges.has(i))g.classList.add('dim');});
  }
  keepEdges.forEach(i=>edgeEls[i].classList.add('hl-edge'));
  keepNodes.forEach(n=>{if(n!==nodeName)nodeEls.get(n).classList.add('related');});
}
function selectNode(name){
  selected=name;
  clearClasses();
  const detail=document.getElementById('detail');
  if(!name){detail.innerHTML='<span class="hint">Chưa chọn bảng. Hover hoặc click vào một bảng để xem các quan hệ.</span>';renderHighlight(hovered,null);return;}
  nodeEls.get(name).classList.add('sel-node');
  const out=outAdj.get(name), inc=inAdj.get(name);
  const keepNodes=new Set([name]); const keepEdges=new Set();
  out.forEach(o=>{keepNodes.add(o.other);keepEdges.add(o.idx);});
  inc.forEach(o=>{keepNodes.add(o.other);keepEdges.add(o.idx);});
  if(dim){
    nodeEls.forEach((g,n)=>{if(!keepNodes.has(n))g.classList.add('dim');});
    edgeEls.forEach((g,i)=>{if(!keepEdges.has(i))g.classList.add('dim');});
  }
  keepEdges.forEach(i=>edgeEls[i].classList.add('hl-edge'));
  keepNodes.forEach(n=>{if(n!==name)nodeEls.get(n).classList.add('related');});
  let html=`<h2>${name}</h2>`;
  html+=`<div class="hint">${out.length} quan hệ đi ra · ${inc.length} quan hệ đi vào</div>`;
  html+='<ul class="rel-list">';
  out.forEach(o=>{html+=`<li><span class="arrow">→</span><span class="name">${o.other}</span><span class="hint">(ERmany → ERone)</span></li>`;});
  inc.forEach(o=>{html+=`<li><span class="arrow">←</span><span class="name">${o.other}</span><span class="hint">(ERmany → ERone)</span></li>`;});
  html+='</ul>';
  detail.innerHTML=html;
}

// zoom/pan
let drag=null;
svg.addEventListener('wheel',(e)=>{
  e.preventDefault();
  const rect=svg.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const sx=vb.x+mx/rect.width*vb.w, sy=vb.y+my/rect.height*vb.h;
  const factor=e.deltaY<0?0.85:1.18;
  const nw=Math.max(200,Math.min(DATA.canvas.w*3,vb.w*factor));
  const nh=nw*vb.h/vb.w;
  vb.x=sx-(mx/rect.width)*nw; vb.y=sy-(my/rect.height)*nh; vb.w=nw; vb.h=nh;
  applyVB();
},{passive:false});
svg.addEventListener('mousedown',(e)=>{drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};svg.classList.add('dragging');});
window.addEventListener('mousemove',(e)=>{
  if(!drag) return;
  const rect=svg.getBoundingClientRect();
  vb.x=drag.vx-(e.clientX-drag.x)/rect.width*vb.w;
  vb.y=drag.vy-(e.clientY-drag.y)/rect.height*vb.h;
  applyVB();
});
window.addEventListener('mouseup',()=>{drag=null;svg.classList.remove('dragging');});

function fit(){
  const pad=30;
  vb={x:-pad,y:-pad,w:DATA.canvas.w+pad*2,h:DATA.canvas.h+pad*2};
  applyVB();
}
document.getElementById('fit').onclick=fit;
document.getElementById('reset').onclick=()=>{fit();selectNode(null);};
document.getElementById('toggleDim').onclick=(e)=>{dim=!dim;e.target.textContent='Dim: '+(dim?'on':'off');if(selected)selectNode(selected);else renderHighlight(hovered,null);};
document.getElementById('search').addEventListener('input',(e)=>{
  const q=e.target.value.trim().toLowerCase();
  clearClasses();
  if(!q) return;
  let found=null;
  nodeEls.forEach((g,n)=>{if(n.toLowerCase().includes(q)){g.classList.add('hl-node');found=found||n;}else{g.classList.add('dim');}});
  if(found){ /* keep first match highlighted */ }
});
document.getElementById('exportPng').onclick=()=>{
  const s=new XMLSerializer().serializeToString(svg);
  const blob=new Blob([s],{type:'image/svg+xml'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=DATA.canvas.w;c.height=DATA.canvas.h;
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0);
    const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='erd-interactive.png';a.click();
    URL.revokeObjectURL(url);
  };
  img.src=url;
};
fit();
</script>
