# Cloud profile — all credentials must be supplied via environment variables.
# Copy backend/.env.cloud.example -> backend/.env.cloud and fill in real values,
# then run backend/run-cloud.ps1 to start with this profile.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hikari — keep pool small for shared/serverless cloud DBs
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
