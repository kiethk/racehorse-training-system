spring.application.name=backend

# Active profile — override by setting SPRING_PROFILES_ACTIVE env var
# Defaults to "local" so plain `./mvnw spring-boot:run` uses local configuration
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# =======================================================
# DATASOURCE (Default Local PostgreSQL)
# =======================================================
# Mặc định kết nối PostgreSQL Local (Port 5432, User postgres).
# Thành viên có mật khẩu khác có thể override trong application-local.properties
# hoặc set biến môi trường SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/rtms_db
spring.datasource.username=postgres
spring.datasource.password=1
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
# JDBC URLs may contain credentials; do not print pool connection metadata.
logging.level.org.hibernate.orm.connections.pooling=WARN

# Flyway
spring.flyway.enabled=true
spring.flyway.out-of-order=true

# JWT
jwt.secret=${JWT_SECRET:rtms-secret-key-2026-doan-swp391-khong-duoc-de-lo-ra-ngoai-nhe}
jwt.access-expiration=1800000
jwt.refresh-expiration=604800000

# Uploaded files (admission documents, incident images).
# Local disk by default; set CLOUDINARY_URL to store them on Cloudinary instead.
rtms.storage.upload-dir=${RTMS_STORAGE_UPLOAD_DIR:${RTMS_ADMISSION_UPLOAD_DIR:./uploads/admissions}}
rtms.storage.cloudinary-url=${CLOUDINARY_URL:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=81MB

# AI & Storage configuration
app.storage.local-dir=./uploads
app.security.hmac-secret=${APP_HMAC_SECRET:rtms-ai-agent-hmac-secret-key-2026-very-secure}

# YOLO OCR Service configuration
rtms.ai.ocr.service-url=${RTMS_AI_OCR_SERVICE_URL:http://localhost:8000}
rtms.ai.ocr.connect-timeout-seconds=${RTMS_AI_OCR_CONNECT_TIMEOUT_SECONDS:5}
rtms.ai.ocr.read-timeout-seconds=${RTMS_AI_OCR_READ_TIMEOUT_SECONDS:35}

# Email (SMTP)
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


