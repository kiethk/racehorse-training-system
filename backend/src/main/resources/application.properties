spring.application.name=backend

# Active profile — override by setting SPRING_PROFILES_ACTIVE env var
# Defaults to "local" so plain `./mvnw spring-boot:run` uses Docker datasource
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Flyway
spring.flyway.enabled=true
spring.flyway.out-of-order=true

# JWT
jwt.secret=rtms-secret-key-2026-doan-swp391-khong-duoc-de-lo-ra-ngoai-nhe
jwt.access-expiration=1800000
jwt.refresh-expiration=604800000

# Admission document uploads (use a private persistent volume for deployment)
rtms.admission.upload-dir=${RTMS_ADMISSION_UPLOAD_DIR:./uploads/admissions}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
