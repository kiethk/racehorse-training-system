# =======================================================
# OPENAI / OPENAI-COMPATIBLE ADAPTER CONFIGURATION
# =======================================================
ai.api.base-url=${AI_BASE_URL:${GROQ_BASE_URL:https://api.openai.com/v1}}
groq.api.base-url=${ai.api.base-url}
ai.api.key=${AI_API_KEY:${GROQ_API_KEY:sk-proj-YOUR_OPENAI_API_KEY_HERE}}
groq.api.key=${ai.api.key}
ai.api.model=${AI_CHAT_MODEL:${GROQ_CHAT_MODEL:gpt-4o-mini}}
groq.api.model=${ai.api.model}
ai.api.temperature=${AI_TEMPERATURE:${GROQ_TEMPERATURE:0.2}}
groq.api.temperature=${ai.api.temperature}
ai.api.max-tokens=${AI_MAX_TOKENS:${GROQ_MAX_TOKENS:4096}}
groq.api.max-tokens=${ai.api.max-tokens}


# Spring AI OpenAI-Compatible adapter
spring.ai.openai.base-url=${ai.api.base-url}
spring.ai.openai.api-key=${ai.api.key}
spring.ai.openai.chat.options.model=${ai.api.model}
