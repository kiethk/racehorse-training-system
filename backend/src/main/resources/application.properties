# =======================================================
# OPENAI / OPENAI-COMPATIBLE ADAPTER CONFIGURATION
# =======================================================
groq.api.base-url=${GROQ_BASE_URL:https://api.openai.com/v1}
groq.api.key=${GROQ_API_KEY:sk-proj-YOUR_OPENAI_API_KEY_HERE}
groq.api.model=${GROQ_CHAT_MODEL:gpt-4o-mini}
groq.api.temperature=${GROQ_TEMPERATURE:0.2}
groq.api.max-tokens=${GROQ_MAX_TOKENS:4096}


# Spring AI OpenAI-Compatible adapter pointing to Groq
spring.ai.openai.base-url=${groq.api.base-url}
spring.ai.openai.api-key=${groq.api.key}
spring.ai.openai.chat.options.model=${groq.api.model}
