spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5433/rtms_db
spring.datasource.username=rtms_user
spring.datasource.password=rtms_password
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.out-of-order=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# JWT
jwt.secret=rtms-secret-key-2026-doan-swp391-khong-duoc-de-lo-ra-ngoai-nhe
jwt.expiration=86400000

# Admission document uploads (use a private persistent volume for deployment)
rtms.admission.upload-dir=${RTMS_ADMISSION_UPLOAD_DIR:./uploads/admissions}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
